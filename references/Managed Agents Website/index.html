<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Managed Agents by DevSavant — Hire a digital worker</title>
<link rel="icon" href="assets/logo-devsavant-isotype-color.png" />
<link rel="stylesheet" href="colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: var(--ds-ink); }
  body {
    font-family: 'Roboto', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
  a { color: inherit; }
  ::selection { background: var(--ds-green-30); color: var(--ds-forest); }

  /* Sticky nav stays above hero background */
  div[style*="position: 'sticky'"] { position: relative; z-index: 41; }

  /* Slack message typing animation */
  @keyframes slack-msg-appear {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slack-msg-1 { animation: slack-msg-appear 400ms cubic-bezier(.2,.7,.1,1) 300ms both; }
  .slack-msg-2 { animation: slack-msg-appear 400ms cubic-bezier(.2,.7,.1,1) 800ms both; }
  .slack-msg-3 { animation: slack-msg-appear 400ms cubic-bezier(.2,.7,.1,1) 1300ms both; }
  .slack-msg-4 { animation: slack-msg-appear 400ms cubic-bezier(.2,.7,.1,1) 1800ms both; }

  /* Heartbeat pulse for the "it works on its own" callout */
  @keyframes hb-pulse {
    0%   { transform: scale(.96); opacity: .9; }
    50%  { transform: scale(1.04); opacity: 1; }
    100% { transform: scale(.96); opacity: .9; }
  }
  @keyframes hb-ring {
    0%   { transform: scale(.6); opacity: .55; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  .hb-dot { animation: hb-pulse 1.6s ease-in-out infinite; }
  .hb-ring-1 { animation: hb-ring 1.6s ease-out infinite; }
  .hb-ring-2 { animation: hb-ring 1.6s ease-out 0.4s infinite; }

  /* Slack thread subtle entrance */
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slack-row { animation: slide-in 600ms cubic-bezier(.2,.7,.1,1) both; }

  /* FAQ chevron */
  .faq-chev { transition: transform 200ms cubic-bezier(.2,.7,.1,1); }
  .faq-open .faq-chev { transform: rotate(180deg); }

  /* Mobile responsive */
  @media (max-width: 768px) {
    .faq-sticky { position: static !important; }
    .mobile-stack { grid-template-columns: 1fr !important; gap: 32px !important; }
    .mobile-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .mobile-hide { display: none !important; }
    section { padding-left: 0 !important; padding-right: 0 !important; }
    section[style*="padding"] { padding-top: 64px !important; padding-bottom: 64px !important; }
    .headless-card { flex-direction: column !important; }
    .heartbeat-callout { padding: 24px 20px !important; }
    .hero-slack-outer { min-height: unset !important; }
    .hero-slack-panel {
      position: relative !important;
      top: auto !important;
      right: auto !important;
      width: 100% !important;
      transform: perspective(1200px) rotateY(-8deg) rotateX(2deg) skewY(-1deg) rotate(2deg) !important;
      margin-top: 16px;
    }
    .hero-section { height: 940px !important; padding-bottom: 0 !important; overflow: hidden !important; }
    .hero-h1 { margin-top: 16px !important; }
  }

  /* In-view-on-scroll polish */
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reveal { animation: fade-up 700ms cubic-bezier(.2,.7,.1,1) both; }

  /* Loading dots animation */
  @keyframes dot-pulse {
    0%, 20% { opacity: 0.4; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
  }
  .loading-dots span {
    display: inline-block;
    animation: dot-pulse 2.2s infinite;
  }
  .loading-dots span:nth-child(1) { animation-delay: 0s; }
  .loading-dots span:nth-child(2) { animation-delay: 0.35s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.7s; }

  /* Slack message reveal animation */
  @keyframes slack-msg-in {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .slack-msg { opacity: 0; }
  .slack-msg-1 { animation: slack-msg-in 600ms cubic-bezier(.25,.46,.45,.94) 800ms forwards; }
  .slack-msg-2 { animation: slack-msg-in 600ms cubic-bezier(.25,.46,.45,.94) 1200ms forwards; }
  .slack-msg-3 { animation: slack-msg-in 600ms cubic-bezier(.25,.46,.45,.94) 1600ms forwards; }
  .slack-msg-4 { animation: slack-msg-in 600ms cubic-bezier(.25,.46,.45,.94) 2000ms forwards; }

  /* Problem quote bubble animation */
  @keyframes problem-quote-in {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .problem-quote { opacity: 0; transform: translateY(20px); }
  .problem-quote.in-view { animation: problem-quote-in 700ms cubic-bezier(.25,.46,.45,.94) forwards; }

    /* Nav mobile/desktop visibility */
  .nav-mobile { display: none !important; }
  .nav-desktop { display: flex; }
  @media (max-width: 768px) {
    .nav-mobile { display: flex !important; }
    .nav-desktop { display: none !important; }
  }
    @media (max-width: 768px) {
      .compare-inner { grid-template-columns: 1fr 1fr !important; }
      .compare-col-competitor { display: none !important; }
    }
  .how-step { opacity: 0; transform: translateY(18px); }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="nav.jsx"></script>
<script type="text/babel" src="hero.jsx"></script>
<script type="text/babel" src="core-sections.jsx"></script>
<script type="text/babel" src="trust-sections.jsx"></script>
<script type="text/babel" src="faq-and-footer.jsx"></script>

<script type="text/babel">
  function App() {
    return (
      <>
        <Nav />
        <Hero />
        <SocialProof />
        <Problem />
        <Difference />
        <WhyManaged />
        <HowItWorks />
        <Channels />
        <Included />
        <Ownership />
        {/* <Pricing /> */}
        <WhyDevSavant />
        <FAQ />
        <FinalCTA />
        <Footer />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<script type="text/babel">
  // Scroll-triggered animations
  document.addEventListener('DOMContentLoaded', () => {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
        }
      });
    }, { threshold: 0.2 });

    document.querySelectorAll('.problem-quote').forEach(el => observer.observe(el));
  });
</script>
