<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Product Engineering · DevSavant</title>
<meta name="description" content="DevSavant is your embedded product team: we build AI-first software, operate intelligent agents, and govern every AI asset from creation to production."/>
<link rel="icon" href="assets/logo-devsavant-isotype-color.png"/>
<style>
/* ── Design tokens ──────────────────────────────────────────────────────── */
@font-face { font-family:"Mulish"; font-weight:300; font-display:swap; src:url("fonts/mulish/Mulish-Light-latin.woff2") format("woff2"); }
@font-face { font-family:"Mulish"; font-weight:400; font-display:swap; src:url("fonts/mulish/Mulish-Regular-latin.woff2") format("woff2"); }
@font-face { font-family:"Mulish"; font-weight:600; font-display:swap; src:url("fonts/mulish/Mulish-SemiBold-latin.woff2") format("woff2"); }
@font-face { font-family:"Mulish"; font-weight:700; font-display:swap; src:url("fonts/mulish/Mulish-Bold-latin.woff2") format("woff2"); }
@font-face { font-family:"Mulish"; font-weight:900; font-display:swap; src:url("fonts/mulish/Mulish-Black-latin.woff2") format("woff2"); }
@font-face { font-family:"Roboto"; font-weight:300; font-display:swap; src:url("fonts/roboto/Roboto-Light-latin.woff2") format("woff2"); }
@font-face { font-family:"Roboto"; font-weight:400; font-display:swap; src:url("fonts/roboto/Roboto-Regular-latin.woff2") format("woff2"); }
@font-face { font-family:"Roboto"; font-weight:500; font-display:swap; src:url("fonts/roboto/Roboto-Medium-latin.woff2") format("woff2"); }
@font-face { font-family:"Roboto"; font-weight:700; font-display:swap; src:url("fonts/roboto/Roboto-Bold-latin.woff2") format("woff2"); }

:root {
  --ds-green:#51AE7B; --ds-ink:#1B1E1C; --ds-teal:#76C4B1;
  --ds-fog:#E2ECEB; --ds-forest:#0D442A;
  --ds-green-30:rgba(81,174,123,.30); --ds-green-12:rgba(81,174,123,.12);
  --ds-ink-90:rgba(27,30,28,.90); --ds-ink-60:rgba(27,30,28,.60);
  --ds-ink-30:rgba(27,30,28,.30); --ds-ink-12:rgba(27,30,28,.12);
  --ds-ink-06:rgba(27,30,28,.06);
  --bg:#fff; --bg-subtle:var(--ds-fog); --surface-muted:#F6F9F8;
  --fg:var(--ds-ink); --fg-muted:var(--ds-ink-60);
  --border:var(--ds-ink-12); --accent:var(--ds-green);
  --font-display:"Mulish",system-ui,sans-serif;
  --font-body:"Roboto",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#fff;color:var(--ds-ink);}
body{font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,h5,h6{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.08;text-wrap:balance;margin:0;}
a{color:var(--ds-forest);text-decoration:none;border-bottom:1px solid transparent;}
a:hover{color:var(--accent);border-bottom-color:currentColor;}
#root{min-height:100vh;overflow-x:clip;}
::selection{background:var(--ds-green-30);color:var(--ds-forest);}
html{scroll-behavior:smooth;}
[id]{scroll-margin-top:80px;}

/* Nav */
@media(max-width:768px){.nav-service-label{display:none!important;}}
.nav-mobile{display:none!important;}
.nav-desktop{display:flex;}
@media(max-width:768px){.nav-mobile{display:flex!important;}.nav-desktop{display:none!important;}}

/* FAQ */
.faq-chev{transition:transform 200ms cubic-bezier(.2,.7,.1,1);}
.faq-open .faq-chev{transform:rotate(180deg);}

/* Heartbeat animations */
@keyframes hb-ping{0%{transform:scale(1);opacity:.7;}100%{transform:scale(2.2);opacity:0;}}
@keyframes live-pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
.hb-ring-1{animation:hb-ping 1.8s ease-out infinite;}
.live-dot{animation:live-pulse 1.8s ease-in-out infinite;}

/* Responsive */
@media(max-width:920px){
  .mobile-stack{grid-template-columns:1fr!important;}
  .pillar-grid{grid-template-columns:1fr 1fr!important;}
  .kpi-grid{grid-template-columns:1fr 1fr!important;}
  .benefit-grid{grid-template-columns:1fr 1fr!important;}
  .gov-card-grid{grid-template-columns:1fr 1fr!important;}
  .train-grid{grid-template-columns:1fr 1fr!important;row-gap:36px!important;}
  .train-line{display:none!important;}
  .spectrum-grid{grid-template-columns:1fr 1fr!important;}
  .footer-grid{grid-template-columns:1fr 1fr!important;}
  .cta-steps{grid-template-columns:1fr!important;}
  .op-grid{grid-template-columns:1fr 1fr!important;}
  .how-grid{grid-template-columns:1fr!important;}
  .how-line{display:none!important;}
  .dark-section-intro{gap:20px!important;margin-bottom:28px!important;}
  .dark-section-intro-body{padding-top:0!important;}
  .heartbeat-callout{padding:24px 20px!important;}
  .heartbeat-callout .mobile-stack{gap:24px!important;}
}
@media(max-width:768px){
  section{padding-top:64px!important;padding-bottom:64px!important;}
  .hero-section{padding-top:110px!important;}
  .hero-h1{font-size:38px!important;}
  .spectrum-grid{grid-template-columns:1fr!important;}
  .security-grid{grid-template-columns:1fr!important;}
  .faq-sticky{position:static!important;}
  .uc-scenario-col{display:none!important;}
  .uc-row{grid-template-columns:1fr 1fr!important;}
  .uc-inner{min-width:0!important;}
  .mobile-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .compare-inner{min-width:600px;}
}
@media(max-width:560px){
  .pillar-grid,.kpi-grid,.benefit-grid,.gov-card-grid,.footer-grid,.op-grid{grid-template-columns:1fr!important;}
  .hero-h1{font-size:34px!important;}
}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ── Shared text constants ─────────────────────────────────────────────────────
const H2 = { fontFamily:'Mulish,sans-serif', fontWeight:700, fontSize:'clamp(32px,3.8vw,52px)', lineHeight:1.08, letterSpacing:'-.022em', color:'var(--ds-ink)', margin:0, textWrap:'balance' };
const BodyLg = { fontFamily:'Roboto,sans-serif', fontSize:17, lineHeight:1.65, color:'var(--ds-ink-90)', textWrap:'pretty' };

// ── Layout ────────────────────────────────────────────────────────────────────
function Container({ children, max=1180, style }) {
  return <div style={{ maxWidth:max, margin:'0 auto', padding:'0 28px', ...style }}>{children}</div>;
}

// ── Icon library (lucide-style) ───────────────────────────────────────────────
function Ico({ name, size=22, color='var(--ds-forest)', sw=1.7 }) {
  const p = { fill:'none', stroke:color, strokeWidth:sw, strokeLinecap:'round', strokeLinejoin:'round' };
  const paths = {
    catalog:   <><path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" {...p}/><path d="M8 3v18M12 8h5M12 12h5M12 16h5" {...p}/></>,
    check:     <><path d="M9 12l2 2 4-4" {...p}/><circle cx="12" cy="12" r="9" {...p}/></>,
    shield:    <><path d="M12 3 19 6V12C19 16 15.5 19 12 21C8.5 19 5 16 5 12V6Z" {...p}/><path d="M9 12 11 14 15 10" {...p}/></>,
    grad:      <><path d="M22 10 12 5 2 10l10 5 10-5z" {...p}/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5" {...p}/></>,
    chart:     <><path d="M3 3v18h18" {...p}/><path d="M7 15l3-4 3 2 4-6" {...p}/></>,
    arrow:     <><path d="M5 12h14M13 5l7 7-7 7" {...p}/></>,
    key:       <><circle cx="8" cy="15" r="4" {...p}/><path d="M10.8 12.2 20 3M16 7l3 3M14 9l2 2" {...p}/></>,
    log:       <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" {...p}/><polyline points="14 2 14 8 20 8" {...p}/><path d="M16 13H8M16 17H8M10 9H8" {...p}/></>,
    revoke:    <><circle cx="12" cy="12" r="9" {...p}/><path d="M5.6 5.6 18.4 18.4" {...p}/></>,
    lock:      <><rect x="4" y="11" width="16" height="10" rx="2" {...p}/><path d="M8 11V7a4 4 0 0 1 8 0v4" {...p}/></>,
    users:     <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" {...p}/><circle cx="9" cy="7" r="4" {...p}/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" {...p}/></>,
    doc:       <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" {...p}/><polyline points="14 2 14 8 20 8" {...p}/></>,
    ban:       <><circle cx="12" cy="12" r="9" {...p}/><path d="M5.6 5.6 18.4 18.4" {...p}/></>,
    sliders:   <><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6" {...p}/></>,
    flask:     <><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3" {...p}/><path d="M7 16h10" {...p}/></>,
    route:     <><circle cx="6" cy="19" r="3" {...p}/><circle cx="18" cy="5" r="3" {...p}/><path d="M9 19h6a4 4 0 0 0 0-8H9a4 4 0 0 1 0-8" {...p}/></>,
    star:      <><path d="m12 3 1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z" {...p}/><path d="M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z" {...p}/></>,
    mobile:    <><rect x="6" y="2" width="12" height="20" rx="2" {...p}/><path d="M11 18h2" {...p}/></>,
    web:       <><rect x="3" y="3" width="18" height="18" rx="2" {...p}/><path d="M3 9h18M9 21V9" {...p}/></>,
    bolt:      <><path d="M13 2 3 14h7l-1 8 10-12h-7z" {...p}/></>,
    monitor:   <><path d="M3 12 H6 L8.5 6 L12 18 L14.5 10 L17 13 H21" {...p}/></>,
    recover:   <><path d="M5 12 A7 7 0 1 1 12 19" {...p}/><path d="M5 12 V8 M5 12 H9" {...p}/></>,
    update:    <><circle cx="12" cy="12" r="7" {...p}/><path d="M12 8 V12 L14.5 14.5" {...p}/></>,
    act: null, graph: null,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" aria-hidden="true">{paths[name]}</svg>;
}

// ── Pill button ───────────────────────────────────────────────────────────────
function Pill({ children, variant='outline-dark', arrow=false, onClick, href, size='md', style }) {
  const [h, setH] = useState(false);
  const sz = { sm:{padding:'10px 20px',fontSize:13}, md:{padding:'14px 28px',fontSize:14}, lg:{padding:'16px 34px',fontSize:15} };
  const base = { display:'inline-flex', alignItems:'center', gap:10, fontFamily:'Mulish,sans-serif', fontWeight:600, lineHeight:1, borderRadius:999, cursor:'pointer', textDecoration:'none', transition:'all 200ms cubic-bezier(.2,.7,.1,1)', border:'1px solid transparent', ...sz[size] };
  const v = {
    'outline-dark':  { background:h?'#1B1E1C':'transparent', color:h?'#fff':'#1B1E1C', borderColor:'#1B1E1C' },
    'outline-green': { background:h?'rgba(81,174,123,.08)':'transparent', color:'#0D442A', borderColor:'#51AE7B' },
    'solid-green':   { background:h?'linear-gradient(135deg,#3C9466 0%,#0D442A 100%)':'linear-gradient(135deg,#51AE7B 0%,#0D442A 100%)', color:'#fff', border:'none', fontWeight:700, boxShadow:h?'0 10px 26px rgba(81,174,123,.40)':'0 4px 14px rgba(81,174,123,.28)' },
    'outline-white': { background:h?'rgba(255,255,255,.10)':'transparent', color:'#fff', borderColor:'rgba(255,255,255,.65)' },
  };
  const Arr = () => <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3.5 10.5L10.5 3.5M4.5 3.5H10.5V9.5" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
  const props = { onClick, onMouseEnter:()=>setH(true), onMouseLeave:()=>setH(false), style:{...base,...v[variant],...style} };
  const content = <>{children}{arrow&&<Arr/>}</>;
  if (href) return <a href={href} {...props}>{content}</a>;
  return <button {...props}>{content}</button>;
}

// ── Overline eyebrow ──────────────────────────────────────────────────────────
function Overline({ children, color='var(--ds-green)' }) {
  return <div style={{ fontFamily:'Mulish,sans-serif', fontWeight:700, fontSize:12, letterSpacing:'.18em', textTransform:'uppercase', color, marginBottom:14, display:'inline-flex', alignItems:'center', gap:10 }}><span style={{ width:22, height:1.5, background:color, display:'inline-block' }}/>{children}</div>;
}

// ── Isotype ───────────────────────────────────────────────────────────────────
function Isotype({ size=28, color='#51AE7B', style }) {
  return (
    <svg width={size} height={size*(40/34)} viewBox="0 0 34 40" fill="none" style={style} aria-hidden="true">
      <defs><linearGradient id="iso-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#76C4B1"/><stop offset="1" stopColor="#0D442A"/></linearGradient></defs>
      <path d="M17 1 C6 12,1 20,1 27 C1 34,8 39,17 39 C26 39,33 34,33 27 C33 20,28 12,17 1 Z" fill={color==='gradient'?'url(#iso-g)':color}/>
      <path d="M17 9 C12 14,10 19,13 23 L17 20 L21 23 C24 19,22 14,17 9 Z" fill="#fff" opacity=".92"/>
      <path d="M13 25 L17 22 L21 25 L21 31 L17 28 L13 31 Z" fill="#fff" opacity=".92"/>
    </svg>
  );
}

// ── Reveal on scroll ──────────────────────────────────────────────────────────
function Reveal({ children, delay=0, style, as='div', className='' }) {
  const [shown, setShown] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current; if (!el) return;
    const ob = new IntersectionObserver(([e])=>{ if(e.isIntersecting){setShown(true);ob.disconnect();} },{threshold:0.12});
    ob.observe(el); return ()=>ob.disconnect();
  }, []);
  const Tag = as;
  return <Tag ref={ref} className={className} style={{ opacity:shown?1:0, transform:shown?'translateY(0)':'translateY(18px)', transition:`opacity 680ms cubic-bezier(.2,.7,.1,1) ${delay}ms,transform 680ms cubic-bezier(.2,.7,.1,1) ${delay}ms`, ...style }}>{children}</Tag>;
}

// ── Check tick ────────────────────────────────────────────────────────────────
function CheckTick({ dark=false }) {
  const s = dark?'rgba(255,255,255,.70)':'var(--ds-green)';
  return <svg width="15" height="15" viewBox="0 0 15 15" fill="none" aria-hidden="true" style={{flexShrink:0}}><circle cx="7.5" cy="7.5" r="6.8" stroke={s} strokeWidth="1.2"/><path d="M4.5 7.8L6.8 10L10.5 5.8" stroke={s} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/></svg>;
}

// ── Nav ───────────────────────────────────────────────────────────────────────
function Nav() {
  const links = [
    { label:'Services',    href:'#services'  },
    { label:'How we work', href:'#process'   },
    { label:'Why us',      href:'#why'       },
    { label:'Contact',     href:'#contact'   },
  ];
  const [scrolled, setScrolled] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);
  useEffect(()=>{ const f=()=>setScrolled(window.scrollY>12); f(); window.addEventListener('scroll',f,{passive:true}); return()=>window.removeEventListener('scroll',f); },[]);
  useEffect(()=>{ document.body.style.overflow=menuOpen?'hidden':''; return()=>{document.body.style.overflow='';};  },[menuOpen]);
  const close=()=>setMenuOpen(false);
  return (
    <>
      <div style={{ position:'fixed',top:0,left:0,right:0,zIndex:41,padding:scrolled?'12px 0 0':'18px 0 0',background:'transparent',transition:'padding 200ms cubic-bezier(.2,.7,.1,1)',pointerEvents:'none' }}>
        <div style={{pointerEvents:'auto'}}>
          <Container max={1260}>
            <nav style={{ background:'#fff',borderRadius:999,boxShadow:scrolled?'0 12px 36px rgba(13,68,42,.10),0 1px 0 rgba(27,30,28,.04)':'0 8px 30px rgba(13,68,42,.06),0 1px 0 rgba(27,30,28,.04)',display:'flex',alignItems:'center',gap:18,padding:'10px 14px 10px 22px',transition:'box-shadow 200ms' }}>
              <a href="#top" onClick={close} style={{display:'flex',alignItems:'center',gap:12,textDecoration:'none',lineHeight:1,borderBottom:'none'}}>
                <img src="assets/logo-devsavant-isotype-color.png" alt="DevSavant" style={{height:28,width:'auto',display:'block'}}/>
                <span style={{display:'flex',alignItems:'center',gap:8,lineHeight:1}}>
                  <span style={{fontFamily:'Mulish,sans-serif',fontWeight:900,letterSpacing:'.02em',color:'var(--ds-ink)',fontSize:15}}><span style={{fontWeight:900}}>DEV</span><span style={{fontWeight:500}}>SAVANT</span></span>
                  <span aria-hidden="true" className="nav-service-label" style={{width:1,height:12,background:'var(--ds-ink-12)'}}/>
                  <span className="nav-service-label" style={{fontFamily:'Mulish,sans-serif',fontWeight:600,fontSize:12,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--ds-forest)'}}>Product Engineering</span>
                </span>
              </a>
              <div className="nav-desktop" style={{display:'flex',gap:2,marginLeft:'auto'}}>
                {links.map(l=><a key={l.label} href={l.href} style={{padding:'10px 14px',borderRadius:999,fontFamily:'Roboto,sans-serif',fontSize:14,fontWeight:500,color:'var(--ds-ink)',textDecoration:'none',borderBottom:'none',transition:'background 180ms'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(81,174,123,.10)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>{l.label}</a>)}
              </div>
              <div className="nav-desktop" style={{display:'flex',gap:8}}><Pill variant="solid-green" size="sm" href="#contact" arrow>Book a session</Pill></div>
              <button className="nav-mobile" onClick={()=>setMenuOpen(o=>!o)} aria-label="Open menu" style={{marginLeft:'auto',background:'transparent',border:'none',cursor:'pointer',width:40,height:40,borderRadius:10,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6H17M3 10H17M3 14H17" stroke="var(--ds-ink)" strokeWidth="1.8" strokeLinecap="round"/></svg>
              </button>
            </nav>
          </Container>
        </div>
      </div>
      <div className="nav-mobile" onClick={close} style={{position:'fixed',inset:0,zIndex:49,background:'rgba(8,43,27,.45)',backdropFilter:'blur(2px)',opacity:menuOpen?1:0,pointerEvents:menuOpen?'auto':'none',transition:'opacity 280ms cubic-bezier(.2,.7,.1,1)'}}/>
      <div className="nav-mobile" style={{position:'fixed',top:0,right:0,bottom:0,zIndex:50,width:288,background:'#fff',boxShadow:'-8px 0 40px rgba(13,68,42,.18)',transform:menuOpen?'translateX(0)':'translateX(100%)',transition:'transform 320ms cubic-bezier(.2,.7,.1,1)',display:'flex',flexDirection:'column',padding:'0 0 32px',overflowY:'auto'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'18px 20px 18px 24px',borderBottom:'1px solid var(--ds-ink-06)'}}>
          <span style={{fontFamily:'Mulish,sans-serif',fontWeight:700,fontSize:13,letterSpacing:'.14em',textTransform:'uppercase',color:'var(--ds-forest)'}}>Menu</span>
          <button onClick={close} style={{background:'var(--ds-fog)',border:'none',cursor:'pointer',width:36,height:36,borderRadius:8,display:'flex',alignItems:'center',justifyContent:'center'}}><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3L13 13M13 3L3 13" stroke="var(--ds-ink)" strokeWidth="1.8" strokeLinecap="round"/></svg></button>
        </div>
        <div style={{display:'flex',flexDirection:'column',padding:'12px 16px',flex:1}}>
          {links.map(l=><a key={l.label} href={l.href} onClick={close} style={{padding:'14px 12px',borderRadius:10,fontFamily:'Mulish,sans-serif',fontSize:18,fontWeight:600,color:'var(--ds-ink)',textDecoration:'none',borderBottom:'1px solid var(--ds-ink-06)'}}>{l.label}</a>)}
        </div>
        <div style={{display:'flex',flexDirection:'column',gap:10,padding:'0 20px'}}><Pill variant="solid-green" size="sm" href="#contact" arrow onClick={close}>Book a session</Pill></div>
      </div>
    </>
  );
}

// ── Hero ──────────────────────────────────────────────────────────────────────
function Hero() {
  return (
    <section id="top" className="hero-section" style={{position:'relative',background:'linear-gradient(160deg,#06200f 0%,#082B1B 45%,#041510 100%)',padding:'120px 0 96px',overflow:'hidden'}}>
      <div aria-hidden="true" style={{position:'absolute',inset:0,backgroundImage:'radial-gradient(circle, rgba(81,174,123,.10) 1.5px, transparent 1.5px)',backgroundSize:'28px 28px',pointerEvents:'none'}}/>
      <div aria-hidden="true" style={{position:'absolute',right:'-12%',bottom:'-40%',width:'55vw',height:'55vw',maxWidth:700,maxHeight:700,borderRadius:'50%',border:'1px solid rgba(255,255,255,.05)',boxShadow:'0 0 0 60px rgba(255,255,255,.015)',pointerEvents:'none'}}/>
      <Container max={1100}>
        <Reveal style={{textAlign:'center'}}>
          <div style={{display:'inline-flex',alignItems:'center',gap:10,fontFamily:'Mulish,sans-serif',fontWeight:700,fontSize:12,letterSpacing:'.18em',textTransform:'uppercase',color:'var(--ds-green)',marginBottom:26}}>
            <span style={{width:22,height:1.5,background:'var(--ds-green)',display:'inline-block'}}/>Product Engineering<span style={{width:22,height:1.5,background:'var(--ds-green)',display:'inline-block'}}/>
          </div>
        </Reveal>
        <Reveal delay={80}>

function OperateService() {
  const [heartInView, setHeartInView] = useState(false);
  const heartRef = useRef(null);
  useEffect(()=>{
    const el=heartRef.current; if(!el) return;
    const ob=new IntersectionObserver(([e])=>{if(e.isIntersecting){setHeartInView(true);ob.disconnect();}},{threshold:0.15});
    ob.observe(el); return()=>ob.disconnect();
  },[]);

  return (
    <>
      <ServiceChapter
        id="operate"
        num="02"
